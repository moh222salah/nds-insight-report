<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NDS Report Studio — مصمم التقارير</title>
<script src="./vendor/react.js"></script><script src="./vendor/react-dom.js"></script><script src="./support.js"></script>
<style>
:root{--ac:#2563EB;--gr:#10B981;--ink:#0F172A;--mt:#64748B;--sf:#F3F6FB;--ln:#E1E8F2;--tint:#E7EFFE;--hv:#EEF3FB;--bg:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Inter,sans-serif;background:var(--sf);color:var(--ink);font-size:14px}
.shell{display:flex;min-height:100vh;background:var(--sf)}.sd{flex:0 0 280px;background:#fff;border-inline-start:1px solid var(--ln);padding:16px 8px}.mn{flex:1;min-width:0;padding:24px;max-width:1360px}
.sg{margin:18px 14px 6px;font-size:12px;font-weight:700;color:var(--mt)}.si{display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;font-weight:600;color:var(--ink);text-decoration:none}.si:hover{background:var(--hv)}.si.on{background:var(--tint);color:#1D4ED8;box-shadow:inset -3px 0 0 var(--ac)}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;margin-bottom:16px;overflow:hidden}.pd{padding:20px 24px}h1{margin:0;font-size:24px;font-weight:700}h2{margin:0;font-size:18px}.mt{color:var(--mt);font-size:13px}
.btn{font:600 14px Cairo,sans-serif;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--ac);background:#fff;color:var(--ac);cursor:pointer}.btn.p{background:var(--ac);color:#fff}.btn.g{background:var(--gr);border-color:var(--gr);color:var(--ink)}.btn.s{height:36px;padding:0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.fx{flex:1;min-width:200px}label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mt)}
input[type=text],input[type=date],input[type=search],select{font:14px Cairo,sans-serif;height:44px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;background:#fff;color:var(--ink);min-width:150px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}.kp b{display:block;font-size:30px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 30px}.cb{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}.cb input{width:18px;height:18px;accent-color:var(--ac)}
.gt{font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--gr);display:inline-block;margin:0 0 6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{background:var(--sf);color:var(--mt);font-size:12px;text-align:start;padding:12px 16px;white-space:nowrap}td{padding:14px 16px;border-top:1px solid var(--ln);white-space:nowrap}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--tint);color:#1D4ED8;border-radius:999px;padding:4px 12px;margin:3px;font-weight:600;font-size:12px}.chip button{border:0;background:none;color:inherit;cursor:pointer}
.ft{padding:16px 24px;background:var(--sf);border-top:1px solid var(--ln);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#0208178c;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.md{background:#fff;border-radius:14px;width:min(920px,100%);max-height:90vh;display:flex;flex-direction:column}.bd{padding:16px 24px;overflow:auto}
.bn{background:var(--tint);color:#1D4ED8;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-weight:600}
@media(max-width:900px){.shell{flex-direction:column}.sd{flex:none;display:flex;overflow-x:auto;padding:8px}.sg{display:none}.mn{padding:14px}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.g3{grid-template-columns:1fr}.pd{padding:16px}.mn{padding:10px}h1{font-size:21px}}
</style></head><body><div id="app"></div><div id="modal"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SOURCES=[['Sales Invoice','فواتير المبيعات'],['Purchase Invoice','فواتير المشتريات'],['Sales Order','أوامر البيع'],['Purchase Order','أوامر الشراء'],['Delivery Note','إذونات التسليم'],['Purchase Receipt','إيصالات الاستلام'],['Customer','العملاء'],['Supplier','الموردون'],['Item','الأصناف'],['Journal Entry','قيود اليومية'],['GL Entry','دفتر الأستاذ'],['Stock Entry','حركات المخزون']];
const NAV=[['overview','نظرة عامة'],['library','مكتبة التقارير'],['designer','مصمم التقارير'],['permissions','الصلاحيات'],['runlog','سجل التشغيل']];
const state={route:'overview',source:'',columns:[],name:'',filters:{from:'',to:'',status:'',company:''},demo:new URLSearchParams(location.search).has('demo'),base:location.origin,token:'',reports:[],users:[],roles:[],who:'',kind:'user',permissionSet:new Set(),preview:[],toast:''};
function nav(){return '<aside class="sd"><div class="sg">NDS Report Studio</div>'+NAV.map(([k,t])=>'<a class="si '+(state.route===k?'on':'')+'" href="#/'+k+'">'+t+'</a>').join('')+'<div class="sg">مصادر البيانات</div>'+SOURCES.slice(0,5).map(([k,t])=>'<a class="si" href="#/designer/'+encodeURIComponent(k)+'">'+t+'</a>').join('')+'<div class="sg">النظام</div><a class="si" target="_blank" href="'+esc(state.base)+'/desk/report">قائمة التقارير الأصلية</a><a class="si" target="_blank" href="'+esc(state.base)+'/desk/permission-manager">مدير الصلاحيات</a></aside>'}
function header(title,sub){return '<div class="row" style="margin-bottom:20px"><div class="fx"><h1>'+title+'</h1><div class="mt">NDS Report Studio — '+sub+'</div></div><a class="btn p" href="#/designer">+ تقرير جديد</a></div>'}
function overview(){return header('نظرة عامة','بيئة تصميم وإدارة التقارير')+'<section class="kp">'+[['تقاريري','—'],['التقارير المصممة','—'],['تشغيلات اليوم','—'],['المستخدمون المخوّلون','—']].map(([t,v])=>'<div class="card pd"><div class="mt">'+t+'</div><b>'+v+'</b><div class="mt">تُحمّل من النظام عند الاتصال</div></div>').join('')+'</section><div class="card pd"><h2>مصادر البيانات المعتمدة</h2><p>'+SOURCES.slice(0,6).map(x=>'<span class="chip">'+x[1]+'</span>').join('')+'</p><p class="mt">التصميم المستقل يحافظ على ألوان وتباعد وعناصر index.html.</p></div>'}
function library(){return header('مكتبة التقارير','استعراض التقارير المحفوظة')+'<div class="card"><div class="pd"><div class="row"><button class="btn p" data-action="mine">تقاريري</button><button class="btn" data-action="all">كل التقارير</button><input type="search" placeholder="بحث باسم التقرير" id="search" class="fx"></div></div><div class="tw"><table><thead><tr><th>اسم التقرير</th><th>مصدر البيانات</th><th>المنشئ</th><th>آخر تعديل</th><th>الإجراءات</th></tr></thead><tbody>'+state.reports.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.ref_doctype||'—')+'</td><td>'+esc(r.owner||'—')+'</td><td>'+esc(r.modified||'—')+'</td><td><button class="btn s" data-action="open" data-name="'+esc(r.name)+'">فتح</button></td></tr>').join('')+'</tbody></table></div></div>'}
function designer(){if(!state.source)return header('مصمم التقارير','اختر مصدر البيانات')+'<div class="kp">'+SOURCES.map(([k,t])=>'<a class="card pd si" href="#/designer/'+encodeURIComponent(k)+'">'+t+'　›</a>').join('')+'</div>';
return header('مصمم التقارير','إعداد الحقول والفلاتر والمعاينة')+'<div class="card pd"><div class="row"><label class="f fx">اسم التقرير<input id="report-name" type="text" value="'+esc(state.name)+'" placeholder="اكتب اسمًا واضحًا للتقرير"></label><button class="btn" data-action="columns">اختيار الأعمدة</button><button class="btn p" data-action="preview">معاينة</button><button class="btn g" data-action="save">حفظ التقرير</button></div><div class="row" style="margin-top:16px"><label class="f">من تاريخ<input type="date" id="from" value="'+state.filters.from+'"></label><label class="f">إلى تاريخ<input type="date" id="to" value="'+state.filters.to+'"></label><label class="f">حالة المستند<select id="status"><option value="">الكل</option><option value="0">مسودة</option><option value="1">معتمد</option><option value="2">ملغى</option></select></label></div><div style="margin-top:12px">'+state.columns.map(c=>'<span class="chip">'+esc(c)+' <button data-action="remove-column" data-name="'+esc(c)+'">×</button></span>').join('')+'</div></div><div class="card"><div class="tw"><table><thead><tr>'+state.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+state.preview.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="ft"><span class="mt">'+(state.preview.length?'نتائج المعاينة':'حدد الأعمدة ثم اضغط معاينة')+'</span></div></div>'}
function permissions(){return header('الصلاحيات','عرض وإدارة وصول الموظفين والأدوار')+'<div class="card"><div class="pd"><div class="row"><button class="btn '+(state.kind==='user'?'p':'')+'" data-action="kind-user">موظف</button><button class="btn '+(state.kind==='role'?'p':'')+'" data-action="kind-role">دور وظيفي</button><label class="f fx">المستهدف<select id="target"><option value="">اختر '+(state.kind==='user'?'موظفًا':'دورًا')+'</option>'+ (state.kind==='user'?state.users:state.roles).map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select></label></div></div>'+(state.who?'<div class="pd" style="border-top:1px solid var(--ln)"><div class="g3">'+['الوصول|عرض التقارير','الوصول|تشغيل التقارير','الإنشاء والتحرير|إنشاء تقرير','الإنشاء والتحرير|تعديل تقاريري','المخرجات|طباعة','المخرجات|تصدير','المشاركة|مشاركة التقرير','الإدارة|حذف تقرير'].map((x,i)=>'<label class="cb"><input type="checkbox" data-perm="'+i+'" '+(state.permissionSet.has(i)?'checked':'')+'> '+x.split('|')[1]+'</label>').join('')+'</div></div><div class="ft"><button class="btn p" data-action="save-permissions">حفظ الصلاحيات</button><button class="btn" data-action="select-all">تحديد/إلغاء الكل</button><span class="mt">تعديلات الدور قد تؤثر على جميع أعضائه</span></div>':'')+'</div>'}
function runlog(){return header('سجل التشغيل','مراجعة سجل الوصول والتشغيل')+'<div class="card pd"><p class="mt">سيظهر سجل التشغيل الفعلي بعد الاتصال بـ ERPNext وتوفر صلاحية Access Log.</p></div>'}
function render(){const pages={overview,library,designer,permissions,runlog};$('#app').innerHTML='<div class="shell">'+nav()+'<main class="mn">'+(state.demo?'<div class="bn">وضع العرض التوضيحي — لا يتم الاتصال بقاعدة بيانات النظام.</div>':'')+(pages[state.route]||overview)()+'</main></div>'}
function modal(html){$('#modal').innerHTML=html}function closeModal(){modal('')}
function sourceFields(){return ['رقم المستند','تاريخ المستند','العميل / المورد','الشركة','الإجمالي','الحالة']}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='columns'){modal('<div class="ov"><div class="md"><div class="pd row"><h2 class="fx">اختيار الأعمدة</h2><button class="btn s" data-action="close">إغلاق</button></div><div class="bd"><div class="g3">'+sourceFields().map(x=>'<label class="cb"><input type="checkbox" data-column="'+esc(x)+'" '+(state.columns.includes(x)?'checked':'')+'> '+x+'</label>').join('')+'</div></div><div class="ft"><button class="btn p" data-action="apply-columns">تطبيق</button><button class="btn" data-action="select-columns">تحديد/إلغاء الكل</button></div></div></div>')}
if(a==='close')closeModal();
if(a==='apply-columns'){state.columns=[...document.querySelectorAll('[data-column]:checked')].map(x=>x.dataset.column);closeModal();render()}
if(a==='select-columns'){const els=[...document.querySelectorAll('[data-column]')],all=els.every(x=>x.checked);els.forEach(x=>x.checked=!all)}
if(a==='remove-column'){state.columns=state.columns.filter(x=>x!==b.dataset.name);render()}
if(a==='preview'){state.preview=state.demo?[[ 'ACC-SINV-0001','2026-10-30','شركة شمس الرياض','الرياض','575.00','معتمد'],['ACC-SINV-0002','2026-10-29','E-Max','الرياض','57.50','مسودة']].map(r=>state.columns.map(c=>r[sourceFields().indexOf(c)]||'—')):[];render()}
if(a==='save'){if(!state.name.trim())return alert('أدخل اسم التقرير');alert(state.demo?'تم حفظ نموذج تجريبي (غير متصل بالنظام).':'يلزم الاتصال بنظام ERPNext لحفظ التقرير.')}
if(a==='mine'||a==='all'){if(state.demo){state.reports=[{name:'فواتير المبيعات حسب العميل',ref_doctype:'Sales Invoice',owner:'demo@nds.sa',modified:'2026-10-30'},{name:'مشتريات الموردين',ref_doctype:'Purchase Invoice',owner:'demo@nds.sa',modified:'2026-10-29'}];render()}}
if(a==='kind-user'||a==='kind-role'){state.kind=a==='kind-user'?'user':'role';state.who='';render()}
if(a==='select-all'){const all=state.permissionSet.size===8;state.permissionSet=all?new Set():new Set([0,1,2,3,4,5,6,7]);render()}
if(a==='save-permissions')alert('يلزم الاتصال بـ ERPNext وتحقق صلاحية System Manager لتطبيق التغييرات.');
if(a==='open'){state.source=b.dataset.name;state.route='designer';render()}
});
document.addEventListener('change',e=>{if(e.target.id==='target'){state.who=e.target.value;state.permissionSet=new Set();render()}if(e.target.dataset.perm!==undefined){const n=+e.target.dataset.perm;e.target.checked?state.permissionSet.add(n):state.permissionSet.delete(n)}if(e.target.id==='from')state.filters.from=e.target.value;if(e.target.id==='to')state.filters.to=e.target.value;if(e.target.id==='status')state.filters.status=e.target.value});
document.addEventListener('input',e=>{if(e.target.id==='report-name')state.name=e.target.value});
window.addEventListener('hashchange',route);function route(){const p=decodeURIComponent(location.hash.slice(1)).split('/');state.route=p[1]||'overview';state.source=p[1]==='designer'?(p[2]||''):'';render()}
route();
</script></body></html>
