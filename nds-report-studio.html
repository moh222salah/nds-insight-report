<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NDS Report Studio | مصمم التقارير المستقل</title>
<style>
:root{--navy:#0A2342;--blue:#164E8F;--gold:#D4AF37;--green:#0F766E;--bg:#F3F6FA;--line:#DCE4EE;--muted:#64748B;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172B43;font:14px Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:var(--navy);color:#fff;padding:22px 14px}.brand{font-size:19px;font-weight:800;padding:8px 10px 24px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#dbe7f5;text-align:right;padding:13px;border-radius:9px}.nav button.active,.nav button:hover{background:#164E8F;color:white}.side-note{font-size:11px;color:#b8c9dc;line-height:1.8;margin:28px 10px}.main{padding:24px;min-width:0;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:24px;margin:0 0 6px;color:var(--navy)}h2{font-size:17px;margin:0 0 14px;color:var(--navy)}.muted{color:var(--muted);font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}.pad{padding:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{padding:18px}.stat b{font-size:26px;display:block;color:var(--blue);margin-top:7px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:6px;min-width:150px;flex:1}.field label{font-size:12px;color:#52657a;font-weight:bold}input,select,textarea{width:100%;border:1px solid #ccd7e4;border-radius:9px;padding:10px;background:#fff;color:#172b43;min-height:40px}textarea{min-height:90px}.btn{border:1px solid var(--blue);border-radius:9px;padding:10px 15px;background:#fff;color:var(--blue);font-weight:bold}.btn.primary{background:var(--blue);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#172b43}.btn.danger{border-color:#dc6262;color:#b42318}.btn.small{padding:7px 10px;font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:white;border-radius:30px;padding:8px 13px}.tabs button.active{background:#e7eff9;border-color:var(--blue);color:var(--blue);font-weight:bold}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{background:#f1f5f9;color:#475569;font-size:12px}td input{min-width:100px}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;background:#edf3fa;color:var(--blue);border-radius:30px;padding:4px 9px;font-size:11px}.notice{padding:12px 14px;background:#eef5ff;border:1px solid #cbdcf2;border-radius:10px;color:#214b78;margin-bottom:14px}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}.check{display:flex;gap:8px;align-items:center}.check input{width:auto;min-height:auto}.footer{display:flex;gap:9px;flex-wrap:wrap;padding:14px;background:#f8fafc;border-top:1px solid var(--line)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:10px}.brand{padding:4px 8px 10px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:10px}.side-note{display:none}.main{padding:14px}}@media(max-width:520px){.main{padding:10px}.top h1{font-size:20px}.pad{padding:13px}.grid{grid-template-columns:1fr 1fr}.btn{padding:9px 11px}.field{min-width:125px}}
@media print{.side,.top .btn,.no-print,.footer{display:none!important}.app{display:block}.main{padding:0}.card{break-inside:avoid}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">NDS · Report Studio</div><nav class="nav"><button data-page="home" class="active">نظرة عامة</button><button data-page="builder">إنشاء تقرير</button><button data-page="library">مكتبة التقارير</button><button data-page="data">مصادر وبيانات</button></nav><div class="side-note">تطبيق مستقل بالكامل.<br>الحفظ محلي في هذا المتصفح فقط.<br>لا يتصل بـ ERPNext ولا يرسل بيانات إليه.</div></aside><main class="main"><div class="top"><div><h1 id="page-title">نظرة عامة</h1><div class="muted">إنشاء وتشغيل وحفظ التقارير دون خادم أو قاعدة بيانات خارجية</div></div><button class="btn primary" data-act="new">＋ تقرير جديد</button></div><div id="view"></div></main></div>
<script>
(function(){
'use strict';
const KEY='nds_report_studio_v2';
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const starter=[{id:'sample-sales',name:'نموذج فواتير مبيعات توضيحي',source:'بيانات توضيحية محلية',columns:['رقم الفاتورة','التاريخ','العميل','المدينة','الإجمالي','الحالة'],rows:[['INV-001','2026-10-28','عميل تجريبي 1','الرياض','1250','معتمد'],['INV-002','2026-10-29','عميل تجريبي 2','جدة','740','مسودة'],['INV-003','2026-10-30','عميل تجريبي 3','الدمام','2100','معتمد']],sample:true}];
let db=load(),page='home',draft=null,lastRows=[];
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&Array.isArray(x.reports)&&Array.isArray(x.datasets)?x:{reports:[],datasets:starter.slice()}}catch(e){return {reports:[],datasets:starter.slice()}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('تعذر الحفظ المحلي: مساحة التخزين غير كافية. صدّر نسخة JSON للاحتفاظ بالعمل.');return false}}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function head(title,sub){$('#page-title').textContent=title;return '<div class="muted" style="margin-bottom:14px">'+sub+'</div>'}
function home(){return head('نظرة عامة','مساحة العمل المحلية')+'<div class="grid"><div class="card stat">التقارير المحفوظة<b>'+db.reports.length+'</b></div><div class="card stat">مصادر البيانات<b>'+db.datasets.length+'</b></div><div class="card stat">مكان الحفظ<b style="font-size:17px">هذا المتصفح</b></div></div><div class="card pad"><h2>ابدأ دورة التقرير</h2><div class="row"><button class="btn primary" data-act="new">إنشاء تقرير</button><button class="btn" data-act="datasets">إدارة مصادر البيانات</button><button class="btn" data-act="library">فتح مكتبة التقارير</button></div><p class="muted" style="margin-top:15px">يمكنك إدخال البيانات يدويًا أو استيراد ملف CSV/JSON، ثم تصميم التقرير وتشغيله وحفظه وتصديره. لا حاجة لأي حساب أو اتصال ERPNext.</p></div><div class="card pad"><h2>نسخ احتياطي واستعادة</h2><div class="row"><button class="btn" data-act="backup">تصدير كل مساحة العمل JSON</button><label class="btn">استيراد نسخة JSON<input id="restore-file" type="file" accept=".json,application/json" hidden></label></div></div>'}
function library(){return head('مكتبة التقارير','تقاريرك المحفوظة على هذا الجهاز')+'<div class="card pad"><div class="row"><div class="field"><label>بحث</label><input id="report-search" placeholder="اسم التقرير أو مصدره"></div><button class="btn primary" data-act="new">＋ تقرير جديد</button></div></div><div class="card table-wrap"><table><thead><tr><th>اسم التقرير</th><th>مصدر البيانات</th><th>الأعمدة</th><th>آخر تعديل</th><th>إجراءات</th></tr></thead><tbody id="report-rows">'+(db.reports.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.datasetName)+'</td><td>'+r.columns.length+'</td><td>'+esc(new Date(r.updated).toLocaleString('ar-EG'))+'</td><td><div class="actions"><button class="btn small" data-act="edit" data-id="'+r.id+'">فتح وتعديل</button><button class="btn small" data-act="execute" data-id="'+r.id+'">تشغيل</button><button class="btn small danger" data-act="delete-report" data-id="'+r.id+'">حذف</button></div></td></tr>').join('')||'<tr><td colspan="5" class="empty">لا توجد تقارير محفوظة بعد. ابدأ بإنشاء تقرير جديد.</td></tr>')+'</tbody></table></div>'}
function datasets(){
 const body=db.datasets.map(d=>`<tr><td>${esc(d.name)}</td><td>${d.rows.length}</td><td>${d.columns.length}</td><td>${d.sample?'توضيحي':'محلي'}</td><td><div class="actions"><button class="btn small" data-act="view-dataset" data-id="${esc(d.id)}">عرض البيانات</button><button class="btn small" data-act="add-row" data-id="${esc(d.id)}">إضافة سجل</button>${d.sample?'':`<button class="btn small danger" data-act="delete-dataset" data-id="${esc(d.id)}">حذف</button>`}</div></td></tr>`).join('');
 return head('مصادر وبيانات','أنشئ مجموعة بيانات خاصة بك أو استورد ملفًا')+
 `<div class="card pad"><h2>إضافة مصدر بيانات</h2><div class="row"><div class="field"><label>اسم المصدر</label><input id="ds-name" placeholder="مثال: مبيعات الربع الرابع"></div><label class="btn">استيراد CSV أو JSON<input id="data-file" type="file" accept=".csv,.json,text/csv,application/json" hidden></label><button class="btn primary" data-act="create-dataset">إنشاء مصدر فارغ</button></div><p class="muted">CSV: الصف الأول أسماء الأعمدة. JSON: مصفوفة كائنات أو مصفوفة صفوف.</p></div><div class="card"><div class="pad"><h2>مصادر البيانات المتاحة</h2></div><div class="table-wrap"><table><thead><tr><th>المصدر</th><th>عدد السجلات</th><th>الأعمدة</th><th>النوع</th><th>إجراء</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}
function builder(){if(!draft)return datasets();const d=db.datasets.find(x=>x.id===draft.datasetId);if(!d)return '<div class="notice">مصدر البيانات غير موجود. اختر مصدرًا آخر.</div>'+datasets();return head(draft.id?'تعديل التقرير':'إنشاء تقرير','حدد الأعمدة وشروط التصفية ثم عاين النتائج واحفظ التقرير')+'<div class="notice">كل البيانات والتقارير محفوظة داخل هذا المتصفح فقط. لا يتم إرسال أي محتوى إلى ERPNext.</div><div class="card pad"><div class="grid"><div class="field"><label>اسم التقرير</label><input id="draft-name" value="'+esc(draft.name)+'" placeholder="اسم واضح للتقرير"></div><div class="field"><label>مصدر البيانات</label><select id="draft-dataset">'+db.datasets.map(x=>'<option value="'+x.id+'" '+(x.id===d.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div></div><h2 style="margin-top:20px">الأعمدة الظاهرة</h2><div class="grid">'+d.columns.map(c=>'<label class="check"><input type="checkbox" data-col="'+esc(c)+'" '+(draft.columns.includes(c)?'checked':'')+'> '+esc(c)+'</label>').join('')+'</div><h2 style="margin-top:20px">شروط التصفية</h2><div class="grid"><div class="field"><label>العمود</label><select id="filter-col"><option value="">بدون فلتر</option>'+d.columns.map(c=>'<option '+(draft.filterCol===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div><div class="field"><label>نوع المطابقة</label><select id="filter-op"><option value="contains">يحتوي على</option><option value="equals">يساوي</option><option value="not">لا يساوي</option></select></div><div class="field"><label>القيمة</label><input id="filter-value" value="'+esc(draft.filterValue||'')+'" placeholder="قيمة الفلتر"></div><div class="field"><label>ترتيب النتائج</label><select id="sort-col"><option value="">بدون ترتيب</option>'+d.columns.map(c=>'<option '+(draft.sortCol===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div><div class="field"><label>الاتجاه</label><select id="sort-dir"><option value="asc">تصاعدي</option><option value="desc" '+(draft.sortDir==='desc'?'selected':'')+'>تنازلي</option></select></div></div><div class="row" style="margin-top:18px"><button class="btn primary" data-act="preview">معاينة التقرير</button><button class="btn gold" data-act="run">تشغيل التقرير</button><button class="btn" data-act="save">حفظ التقرير</button><button class="btn" data-act="back">رجوع</button></div></div><div class="card"><div class="pad"><div class="row" style="justify-content:space-between"><h2>نتائج المعاينة والتشغيل</h2><span class="pill">'+lastRows.length+' سجل</span></div></div><div class="table-wrap" id="result-table">'+resultTable(lastRows,draft.columns)+'</div><div class="footer"><button class="btn small" data-act="export-csv">تصدير CSV</button><button class="btn small" data-act="export-json">تصدير JSON</button><button class="btn small" data-act="print">طباعة التقرير</button></div></div>'}
function resultTable(rows,cols){return '<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+(rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="'+Math.max(cols.length,1)+'" class="empty">لا توجد نتائج. تحقق من الفلاتر أو أضف بيانات للمصدر.</td></tr>')+'</tbody></table>'}
function render(){const views={home,library,datasets,builder};$('#view').innerHTML=(views[page]||home)()}
function newDraft(){draft={id:null,name:'',datasetId:db.datasets[0]?.id||'',columns:db.datasets[0]?.columns.slice()||[],filterCol:'',filterOp:'contains',filterValue:'',sortCol:'',sortDir:'asc'};lastRows=[];go('builder')}
function run(){if(!draft)return;draft.name=$('#draft-name').value;draft.columns=[...document.querySelectorAll('[data-col]:checked')].map(x=>x.dataset.col);draft.filterCol=$('#filter-col').value;draft.filterOp=$('#filter-op').value;draft.filterValue=$('#filter-value').value;draft.sortCol=$('#sort-col').value;draft.sortDir=$('#sort-dir').value;if(!draft.columns.length){alert('اختر عمودًا واحدًا على الأقل');return}const d=db.datasets.find(x=>x.id===draft.datasetId);lastRows=d.rows.filter(row=>{if(!draft.filterCol||!draft.filterValue)return true;const v=String(row[draft.filterCol]??'');return draft.filterOp==='equals'?v===draft.filterValue:draft.filterOp==='not'?v!==draft.filterValue:v.toLowerCase().includes(draft.filterValue.toLowerCase())});if(draft.sortCol)lastRows.sort((a,b)=>String(a[draft.sortCol]??'').localeCompare(String(b[draft.sortCol]??''),'ar',{numeric:true})*(draft.sortDir==='desc'?-1:1));render()}
function save(){if(!draft.name.trim()){alert('أدخل اسم التقرير');return}if(!draft.columns.length){alert('اختر الأعمدة');return}const d=db.datasets.find(x=>x.id===draft.datasetId);const item={id:draft.id||uid(),name:draft.name.trim(),datasetId:d.id,datasetName:d.name,columns:draft.columns.slice(),filterCol:draft.filterCol,filterOp:draft.filterOp,filterValue:draft.filterValue,sortCol:draft.sortCol,sortDir:draft.sortDir,updated:new Date().toISOString()};const i=db.reports.findIndex(x=>x.id===item.id);if(i<0)db.reports.unshift(item);else db.reports[i]=item;if(persist()){draft.id=item.id;alert('تم حفظ التقرير بنجاح محليًا في هذا المتصفح.');go('library')}}
function download(name,text,type){const blob=new Blob([text],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(rows,cols){return '\ufeff'+[cols,...rows.map(r=>cols.map(c=>r[c]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function parseCSV(text){const out=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&q&&text[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x!==''))out.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x!==''))out.push(row);return out}
async function importFile(file){const text=await file.text(),name=$('#ds-name')?.value.trim()||file.name.replace(/\.[^.]+$/,'');let cols=[],rows=[];if(file.name.toLowerCase().endsWith('.json')){const data=JSON.parse(text);if(!Array.isArray(data)||!data.length)throw Error('ملف JSON يجب أن يحتوي على مصفوفة سجلات غير فارغة');if(Array.isArray(data[0])){cols=data[0].map(String);rows=data.slice(1).map(r=>Object.fromEntries(cols.map((c,i)=>[c,r[i]??''])))}else{cols=[...new Set(data.flatMap(x=>Object.keys(x)))];rows=data.map(x=>Object.fromEntries(cols.map(c=>[c,x[c]??''])))} }else{const parsed=parseCSV(text);if(parsed.length<2)throw Error('ملف CSV يجب أن يحتوي على صف عناوين وصف بيانات على الأقل');cols=parsed[0].map((x,i)=>x.trim()||('حقل '+(i+1)));rows=parsed.slice(1).map(r=>Object.fromEntries(cols.map((c,i)=>[c,r[i]??''])))}if(!cols.length)throw Error('لم يتم العثور على أعمدة');db.datasets.unshift({id:uid(),name,columns:cols,rows,sample:false});if(persist()){alert('تم استيراد '+rows.length+' سجلًا وحفظ المصدر محليًا.');go('datasets')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='new')newDraft();if(a==='library')go('library');if(a==='datasets')go('datasets');if(a==='back')go('datasets');
if(a==='preview'||a==='run')run();if(a==='save')save();
if(a==='delete-report'){if(confirm('حذف التقرير نهائيًا من مساحة هذا المتصفح؟')){db.reports=db.reports.filter(x=>x.id!==b.dataset.id);persist();render()}}
if(a==='edit'){const r=db.reports.find(x=>x.id===b.dataset.id);if(r){draft={...r,columns:r.columns.slice()};lastRows=[];go('builder')}}
if(a==='execute'){const r=db.reports.find(x=>x.id===b.dataset.id);if(r){draft={...r,columns:r.columns.slice()};go('builder');setTimeout(run,0)}}
if(a==='create-dataset'){const name=$('#ds-name').value.trim();if(!name)return alert('اكتب اسم المصدر');db.datasets.unshift({id:uid(),name,columns:[],rows:[],sample:false});persist();alert('تم إنشاء مصدر فارغ. أضف أعمدته وسجلاته من إدارة البيانات.');render()}
if(a==='delete-dataset'){if(confirm('حذف مصدر البيانات؟ التقارير المرتبطة به لن تعمل بعد الحذف.')){db.datasets=db.datasets.filter(x=>x.id!==b.dataset.id);persist();render()}}
if(a==='view-dataset'||a==='add-row'){const d=db.datasets.find(x=>x.id===b.dataset.id);if(!d)return;const vals=d.columns.map(c=>prompt('أدخل قيمة الحقل: '+c,'')).map(x=>x===null?'':x);if(a==='add-row'){if(!d.columns.length){const raw=prompt('أدخل أسماء الأعمدة مفصولة بفاصلة');if(!raw)return;d.columns=raw.split(',').map(x=>x.trim()).filter(Boolean);const values=d.columns.map(c=>prompt('قيمة '+c,'')||'');d.rows.push(Object.fromEntries(d.columns.map((c,i)=>[c,values[i]])))}else d.rows.push(Object.fromEntries(d.columns.map((c,i)=>[c,vals[i]])));persist();render()}else{alert('المصدر: '+d.name+'\nعدد السجلات: '+d.rows.length+'\nالأعمدة: '+d.columns.join('، '))}}
if(a==='export-csv'&&draft){download((draft.name||'report')+'.csv',csv(lastRows,draft.columns),'text/csv;charset=utf-8')}
if(a==='export-json'&&draft)download((draft.name||'report')+'.json',JSON.stringify({name:draft.name,columns:draft.columns,rows:lastRows},null,2),'application/json')
if(a==='print')window.print();
if(a==='backup')download('nds-report-studio-backup.json',JSON.stringify(db,null,2),'application/json');
});
document.addEventListener('change',e=>{if(e.target.id==='draft-dataset'){draft.datasetId=e.target.value;const d=db.datasets.find(x=>x.id===draft.datasetId);draft.columns=d.columns.slice();lastRows=[];render()}if(e.target.id==='data-file'&&e.target.files[0])importFile(e.target.files[0]).catch(err=>alert('تعذر استيراد الملف: '+err.message));if(e.target.id==='restore-file'&&e.target.files[0])e.target.files[0].text().then(t=>{const x=JSON.parse(t);if(!Array.isArray(x.reports)||!Array.isArray(x.datasets))throw Error('نسخة غير صالحة');if(confirm('استبدال مساحة العمل الحالية بالنسخة المستوردة؟')){db=x;persist();go('home')}}).catch(err=>alert('فشل الاستعادة: '+err.message))});
document.addEventListener('input',e=>{if(e.target.id==='report-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('#report-rows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}});
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
