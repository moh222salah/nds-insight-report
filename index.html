<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6FB">
<title>NDS Report Studio | لوحة التقارير</title>
<meta name="description" content="لوحة NDS Report Studio لإدارة وتصميم وتشغيل التقارير.">
<script>
(function(){
  'use strict';
  var routes={
    overview:'home',
    designer:'builder'
  };
  var allowed=[
    'home','library','builder','permissions','templates','runlog',
    'published','drafts','shared','favorites',
    'source-sales','source-purchases','source-stock','source-partners',
    'access','versions','schedules'
  ];
  var requested=(window.location.hash||'').slice(1);
  if(requested.charAt(0)==='/')requested=requested.slice(1);
  var page=routes[requested]||requested;
  if(!allowed.includes(page))page='home';
  window.location.replace(new URL('./nds-report-studio.html#'+page,window.location.href).href);
})();
</script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F6FB;color:#0F172A;font:14px/1.7 Cairo,Arial,sans-serif}
main{padding:28px;text-align:center}
a{color:#2563EB;font-weight:700}
</style>
</head>
<body>
<main>
  <p>جارٍ فتح لوحة NDS Report Studio الرئيسية…</p>
  <a href="./nds-report-studio.html#home">فتح نظرة عامة</a>
</main>
</body>
</html>
